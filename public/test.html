<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSG tests</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
        padding: 1.5rem;
      }
      .pass {
        color: #5ecf8a;
      }
      .fail {
        color: #e07a7a;
      }
      #results {
        white-space: pre-wrap;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Spelling Star Garden — tests</h1>
    <div id="results"></div>
    <script src="words.js"></script>
    <script src="ssg-tests.js"></script>
    <script>
      (function () {
        const result = runSsgTests();
        const node = document.getElementById("results");
        node.innerHTML = result.lines
          .map(function (l) {
            const cls =
              l.indexOf("FAIL") === 0
                ? "fail"
                : l.indexOf("PASS") === 0
                  ? "pass"
                  : "";
            return (
              '<div class="' +
              cls +
              '">' +
              l.replace(/</g, "&lt;") +
              "</div>"
            );
          })
          .join("");
        document.title = (result.fail === 0 ? "✓" : "✗") + " SSG tests";
      })();
    </script>
  </body>
</html>
