<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1b2e" />
    <title>Spelling Star Garden</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="celebrate" class="celebrate" aria-hidden="true"></div>

    <!-- PROFILE PICKER -->
    <section id="screen-profiles" class="screen active" aria-label="Who is playing">
      <h1>Spelling Star Garden</h1>
      <p class="tagline">Who is playing?</p>
      <div id="profile-list" class="profile-list"></div>
      <p class="site-footer">
        <a href="https://ngpestelos.com" rel="noopener noreferrer">ngpestelos.com</a>
      </p>
    </section>

    <!-- HOME -->
    <section id="screen-home" class="screen" aria-label="Home">
      <button
        type="button"
        id="btn-gear"
        class="gear"
        aria-label="Parent settings"
        title="Parent settings"
      >
        ⚙️
      </button>
      <div class="player-badge" aria-live="polite">
        <span id="player-emoji" class="player-badge-emoji">🌟</span>
        <span id="player-name" class="player-badge-name">Player</span>
      </div>
      <h1>Spelling Star Garden</h1>
      <p class="tagline">Grow stars by spelling words</p>
      <div id="garden-preview" class="garden-preview" aria-hidden="true">🌱</div>
      <div class="stats-row">
        <span>Stickers: <strong id="sticker-count">0</strong></span>
        <span>Gardens: <strong id="session-count">0</strong></span>
      </div>
      <div class="btn-row">
        <button type="button" id="btn-play" class="btn btn-primary">Play</button>
        <button type="button" id="btn-switch-player" class="btn btn-secondary">
          Switch player
        </button>
      </div>
      <p class="site-footer">
        <a href="https://ngpestelos.com" rel="noopener noreferrer">ngpestelos.com</a>
      </p>
    </section>

    <!-- SESSION -->
    <section id="screen-session" class="screen" aria-label="Spelling session">
      <div class="top-bar">
        <button type="button" id="btn-exit" class="btn btn-ghost">Exit</button>
        <div id="stars" class="stars" aria-label="Stars progress"></div>
        <span class="sr-only" id="session-status"></span>
      </div>

      <span id="bonus-badge" class="bonus-badge"></span>
      <div id="picture" class="picture" aria-hidden="true">🐱</div>
      <div id="cheat-word" class="cheat-word" aria-live="polite"></div>
      <p id="parent-read-hint" class="hint"></p>

      <button type="button" id="btn-hear" class="btn btn-secondary">
        ▶ Hear word
      </button>

      <div id="slots" class="slots" aria-label="Letter slots"></div>
      <p id="hint" class="hint">Tap the letters in order</p>
      <div id="tiles" class="tiles" aria-label="Letter tiles"></div>
    </section>

    <!-- COMPLETE -->
    <section id="screen-complete" class="screen" aria-label="Session complete">
      <h1 id="complete-msg">Garden complete!</h1>
      <div id="complete-stars" class="complete-stars" aria-hidden="true"></div>
      <div id="sticker-award" class="sticker-award" aria-hidden="true">🌱</div>
      <p id="sticker-label" class="tagline">New sticker</p>
      <p id="rest-note" class="rest-note">Great job — rest your brain!</p>
      <div class="btn-row">
        <button type="button" id="btn-done" class="btn btn-primary">Done</button>
        <button type="button" id="btn-again" class="btn btn-secondary">
          Play again
        </button>
      </div>
    </section>

    <!-- PARENT -->
    <section id="screen-parent" class="screen" aria-label="Parent settings">
      <h1>Parent</h1>
      <p id="parent-player-label" class="tagline">Settings for current player</p>
      <div class="parent-form">
        <div class="field">
          <label for="setting-length">Words per garden</label>
          <select id="setting-length">
            <option value="3">3 (short session)</option>
            <option value="5" selected>5 (default)</option>
            <option value="8">8 (longer session)</option>
          </select>
        </div>
        <div class="field">
          <label for="setting-level">Word length</label>
          <select id="setting-level">
            <option value="short">Short (cat, fish)</option>
            <option value="medium">Medium (apple, happy)</option>
            <option value="long" selected>Long (teacher, school)</option>
            <option value="mix">Mix all lengths</option>
          </select>
        </div>
        <div class="field check-row">
          <input type="checkbox" id="setting-speech" checked />
          <label for="setting-speech">Speech (Hear word)</label>
        </div>
        <div class="field check-row">
          <input type="checkbox" id="setting-motion" />
          <label for="setting-motion">Reduce motion</label>
        </div>
        <div class="field check-row">
          <input type="checkbox" id="setting-cheat" />
          <label for="setting-cheat">Show word (cheat / parent help)</label>
        </div>
        <button type="button" id="btn-reset" class="btn btn-secondary">
          Reset this player only
        </button>
      </div>
      <div class="btn-row">
        <button type="button" id="btn-parent-save" class="btn btn-primary">
          Save
        </button>
        <button type="button" id="btn-parent-back" class="btn btn-ghost">
          Back
        </button>
      </div>
    </section>

    <script src="words.js"></script>
    <script src="app.js"></script>
  </body>
</html>
